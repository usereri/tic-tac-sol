# Builds app/ and publishes it to GitHub Pages (https://usereri.github.io/tic-tac-sol/).
# Configure under Settings → Secrets and variables → Actions → Variables (all values are public):
#   VITE_RPC_URL, VITE_WS_URL           optional, default to the public devnet endpoints
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY   required for cross-device matchmaking
name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_CLUSTER: devnet
          VITE_RPC_URL: ${{ vars.VITE_RPC_URL || 'https://api.devnet.solana.com' }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL || 'wss://api.devnet.solana.com' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
